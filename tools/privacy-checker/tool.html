<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐私追踪检测</title>
  <link rel="stylesheet" href="../../content/theme-tool.css">
  <link rel="stylesheet" href="tool.css">
</head>
<body>
  <div class="tool-container">
    <div class="pc-toolbar">
      <button class="btn btn--primary" id="btn-scan">🛡️ 检测当前页面</button>
      <button class="btn btn--secondary" id="btn-refresh">🔄 重新检测</button>
    </div>

    <div class="pc-score-section" id="pc-score-section">
      <div class="pc-score-placeholder">点击"检测当前页面"开始隐私检测</div>
    </div>

    <div class="pc-results" id="pc-results"></div>

    <div class="pc-recommendations" id="pc-recommendations" style="display:none">
      <div class="pc-section-head">💡 安全建议</div>
      <div class="pc-reco-list" id="pc-reco-list"></div>
    </div>

    <div class="tool-disclaimer">⚠️ 注意：此工具仅用于学习研究，请勿用于非法用途。检测结果仅供参考，不代表完整的安全评估。</div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../../common/tool-i18n-dict.js"></script>
  <script src="../../common/tool-i18n.js"></script>
<script src="../../common/tool-runtime.js"></script>
<script src="tool.js"></script>
</body>
</html>
