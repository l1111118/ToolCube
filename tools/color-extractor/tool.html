<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>网页颜色提取</title><link rel="stylesheet" href="../../content/theme-tool.css"><link rel="stylesheet" href="tool.css"></head><body>
<div class="ce-container">
  <h3>🎨 网页颜色提取器</h3>
  <p>提取当前页面中使用的所有颜色</p>
  <div class="ce-actions">
    <button class="btn btn--primary" id="btn-extract">🔍 提取颜色</button>
    <button class="btn btn--secondary" id="btn-copy-all">📋 复制全部</button>
    <button class="btn btn--secondary" id="btn-export-scss">🎨 导出SCSS</button>
    <button class="btn btn--secondary" id="btn-export-css">📦 导出CSS变量</button>
    <button class="btn btn--secondary" id="btn-merge-similar">🔀 合并相似色</button>
  </div>
  <div class="ce-stats" id="ce-stats"></div>
  <div class="ce-colors" id="ce-colors"><div class="ce-empty">点击"提取颜色"分析当前页面配色方案</div></div>

  <div class="tool-disclaimer">⚠️ 注意：此工具仅用于学习研究，请勿用于非法用途。</div>
</div>
  <script src="../../common/tool-i18n-dict.js"></script>
  <script src="../../common/tool-i18n.js"></script>
<script src="../../common/tool-runtime.js"></script>
<script src="tool.js"></script></body></html>
