<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>UUID生成器</title><link rel="stylesheet" href="../../content/theme-tool.css">
<link rel="stylesheet" href="tool.css"></head>
<body>
<div class="tool-container">
  <div class="tool-toolbar">
    <div class="toolbar-group">
      <button class="btn btn--primary" id="btn-generate">🎲 生成UUID</button>
      <button class="btn btn--secondary" id="btn-bulk">📦 批量生成</button>
    </div>
    <div class="toolbar-group">
      <button class="btn btn--icon" id="btn-copy" title="复制全部">📋</button>
      <button class="btn btn--icon" id="btn-clear" title="清空">🗑️</button>
    </div>
  </div>
  <div class="uuid-content">
    <div class="uuid-options">
      <label class="radio-label"><input type="radio" name="format" value="standard" checked> 标准 (xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx)</label>
      <label class="radio-label"><input type="radio" name="format" value="compact"> 紧凑 (无连字符)</label>
      <label class="radio-label"><input type="radio" name="format" value="uppercase"> 大写</label>
      <label class="radio-label"><input type="radio" name="format" value="v7"> UUID v7 (时间排序)</label>
      <div class="bulk-row"><label>批量数量:</label><input type="number" id="bulk-count" value="1" min="1" max="100" style="width:80px;padding:4px 8px"></div>
    </div>
    <div class="uuid-list" id="uuid-list"><div class="uuid-item">点击"生成UUID"开始</div></div>
  </div>
</div>
  <script src="../../common/tool-i18n-dict.js"></script>
  <script src="../../common/tool-i18n.js"></script>
<script src="../../common/tool-runtime.js"></script>
<script src="tool.js"></script>
</body>
</html>
