<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode转换</title>
    <link rel="stylesheet" href="../../content/theme-tool.css">
    <link rel="stylesheet" href="tool.css">
  </head>
  <body>
    <div class="tool-container">
      <div class="tool-toolbar">
        <div class="toolbar-group"><button class="btn btn--primary" id="btn-to-unicode">🔒 中文→Unicode</button><button class="btn btn--secondary" id="btn-from-unicode">🔓 Unicode→中文</button>
        </div>
        <div class="toolbar-group"><button class="btn btn--icon" id="btn-swap" title="交换">⇄</button><button class="btn btn--icon" id="btn-copy" title="复制">📋</button><button class="btn btn--icon" id="btn-clear" title="清空">🗑️</button>
        </div>
      </div>
      <div class="tool-main">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">📥 输入</span>
          </div>
          <div class="panel-body">
            <textarea class="code-editor" id="input-area" placeholder="输入文本..." spellcheck="false"></textarea>
          </div>
          <div class="panel-footer"><span id="input-status">0 字符</span>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">📤 输出</span>
          </div>
          <div class="panel-body">
            <textarea class="code-editor code-editor--output" id="output-area" placeholder="转换结果..." readonly></textarea>
          </div>
          <div class="panel-footer"><span id="output-status">等待输入</span>
          </div>
        </div>
      </div>
    </div>
    <script src="../../common/tool-i18n-dict.js"></script>
    <script src="../../common/tool-i18n.js"></script>
    <script src="../../common/tool-runtime.js"></script>
    <script src="tool.js"></script>
  </body>
</html>
