<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>代码压缩</title><link rel="stylesheet" href="../../content/theme-tool.css"><link rel="stylesheet" href="tool.css"></head>
<body>
<div class="tool-container">
<div class="tool-toolbar">
<div class="toolbar-group"><button class="btn btn--primary" id="btn-minify">📦 压缩</button><button class="btn btn--secondary" id="btn-beautify">✨ 美化</button></div>
<div class="toolbar-group"><select class="select" id="lang-select"><option value="js">JavaScript</option><option value="css">CSS</option><option value="html">HTML</option></select><button class="btn btn--icon" id="btn-swap">⇄</button><button class="btn btn--icon" id="btn-copy">📋</button><button class="btn btn--icon" id="btn-clear">🗑️</button></div></div>
<div class="tool-main"><div class="panel"><div class="panel-header"><span>📥 输入代码</span><button class="btn btn--text" id="btn-paste">📋粘贴</button></div>
<div class="panel-body"><textarea class="code-editor" id="input-area" placeholder="输入要压缩/美化的代码..." spellcheck="false"></textarea></div>
<div class="panel-footer"><span id="input-status">0 字符</span></div></div>
<div class="panel"><div class="panel-header"><span>📤 输出</span></div><div class="panel-body"><textarea class="code-editor code-editor--output" id="output-area" placeholder="结果..." readonly></textarea></div>
<div class="panel-footer"><span id="output-status">等待输入</span></div></div></div>
<div class="validation-bar"><span id="validation-icon">💡</span> <span id="validation-text">支持 JS/CSS/HTML 代码压缩和美化</span></div></div>
  <script src="../../common/tool-i18n-dict.js"></script>
  <script src="../../common/tool-i18n.js"></script>
<script src="../../common/tool-runtime.js"></script>
<script src="tool.js"></script></body></html>
