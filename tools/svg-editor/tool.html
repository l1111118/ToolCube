<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG预览</title>
    <link rel="stylesheet" href="../../content/theme-tool.css">
    <link rel="stylesheet" href="tool.css">
  </head>
  <body>
    <div class="tool-container">
      <div class="tool-toolbar">
        <div class="toolbar-group"><button class="btn btn--primary" id="btn-preview">👁️ 预览</button><button class="btn btn--secondary" id="btn-copy-code">📋 复制代码</button><button class="btn btn--secondary" id="btn-download">💾 下载SVG</button>
        </div>
        <div class="toolbar-group"><button class="btn btn--icon" id="btn-fit" title="适应窗口">🔲</button><button class="btn btn--icon" id="btn-clear" title="清空">🗑️</button>
        </div>
      </div>
      <div class="tool-main">
        <div class="panel">
          <div class="panel-header"><span>📥 SVG代码</span>
          </div>
          <div class="panel-body">
            <textarea class="code-editor" id="input-area" placeholder='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#5b7fff"/></svg>' spellcheck="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="80" fill="#5b7fff"/>
  <circle cx="70" cy="80" r="15" fill="white"/>
  <circle cx="130" cy="80" r="15" fill="white"/>
  <path d="M60 130 Q100 170 140 130" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg></textarea>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><span>👁️ 预览</span>
          </div>
          <div class="panel-body preview-body">
            <div class="svg-preview" id="svg-preview">
            </div>
          </div>
        </div>
      </div>
      <div class="validation-bar" id="validation-bar"><span id="validation-icon">💡</span><span id="validation-text">支持实时编辑SVG代码并预览</span>
      </div>
    </div>
    <script src="../../common/tool-i18n-dict.js"></script>
    <script src="../../common/tool-i18n.js"></script>
    <script src="../../common/tool-runtime.js"></script>
    <script src="tool.js"></script>
  </body>
</html>
