<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据格式转换</title>
  <link rel="stylesheet" href="../../content/theme-tool.css">
<link rel="stylesheet" href="tool.css">
</head>
<body>
  <div class="tool-container">
    <div class="converter-header">
      <select class="select" id="from-format">
        <option value="json">JSON</option>
        <option value="xml">XML</option>
        <option value="yaml">YAML</option>
        <option value="csv">CSV</option>
      </select>
      <span class="arrow">➜</span>
      <select class="select" id="to-format">
        <option value="json">JSON</option>
        <option value="xml">XML</option>
        <option value="yaml">YAML</option>
        <option value="csv">CSV</option>
      </select>
      <button class="btn btn--primary" id="btn-convert">转换</button>
    </div>
    <div class="editor-layout">
      <textarea class="code-editor" id="input-area" placeholder="输入数据..."></textarea>
      <textarea class="code-editor code-editor--output" id="output-area" placeholder="结果..." readonly></textarea>
    </div>
    <div class="actions">
      <button class="btn btn--secondary" id="btn-copy">📋 复制</button>
      <button class="btn btn--secondary" id="btn-download">💾 下载</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../../common/tool-i18n-dict.js"></script>
  <script src="../../common/tool-i18n.js"></script>
<script src="../../common/tool-runtime.js"></script>
<script src="tool.js"></script>
</body>
</html>
