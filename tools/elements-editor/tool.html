<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素编辑器</title>
<link rel="stylesheet" href="../../content/theme-tool.css">
<link rel="stylesheet" href="tool.css">
<!-- 主题同步逻辑已移至 tool.js 顶部。
     原先此处为内联 <script>，但扩展页 CSP 为 script-src 'self'（不含 'unsafe-inline'），
     内联脚本会被浏览器直接拒绝执行，这段代码从未生效（表现为打开工具时主题闪烁）。 -->
</head>
<body>
<div class="ee-container">

  <!-- 工具栏 -->
  <div class="ee-toolbar">
    <!-- 模式切换 -->
    <div class="ee-mode-toggle">
      <button class="ee-mode-btn ee-mode-btn--active" data-mode="page" id="btn-mode-page">🌐 页面元素</button>
      <button class="ee-mode-btn" data-mode="code" id="btn-mode-code">📝 代码编辑</button>
    </div>
    <button class="ee-btn ee-btn--primary" id="btn-select" title="点击后在页面上选择元素">🔍 选择元素</button>
    <button class="ee-btn ee-btn--secondary" id="btn-cancel" style="display:none">✕ 取消</button>
    <button class="ee-btn ee-btn--secondary" id="btn-refresh" title="刷新当前元素信息">🔄 刷新</button>
    <button class="ee-btn ee-btn--secondary" id="btn-scroll" title="滚动到当前元素">📍 定位</button>
    <button class="ee-btn ee-btn--secondary" id="btn-copy-sel" title="复制CSS选择器">📋 选择器</button>
    <button class="ee-btn ee-btn--secondary" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>↩️ 撤销</button>
    <button class="ee-btn ee-btn--secondary" id="btn-redo" title="重做 (Ctrl+Y)" disabled>↪️ 重做</button>
    <button class="ee-btn ee-btn--danger" id="btn-delete" title="删除当前选中元素" disabled>🗑 删除</button>
    <span class="ee-status" id="ee-status">点击"选择元素"开始检查</span>
  </div>

  <!-- 代码编辑模式 -->
  <div class="ee-code-mode" id="ee-code-mode" style="display:none">
    <div class="ee-code-layout">
      <div class="ee-code-pane">
        <div class="ee-code-pane__header">
          <span class="ee-code-pane__title">HTML 代码</span>
          <div class="ee-code-pane__actions">
            <button class="ee-btn ee-btn--secondary ee-btn--sm" id="btn-code-clear">清除</button>
            <button class="ee-btn ee-btn--primary ee-btn--sm" id="btn-code-render">▶ 渲染预览</button>
          </div>
        </div>
        <textarea class="ee-code-input" id="ee-code-input" placeholder="在此输入或粘贴 HTML 代码...&#10;&#10;示例：&#10;<div style=&quot;padding:20px;background:#f0f0f0;border-radius:8px&quot;>&#10;  <h2>Hello World</h2>&#10;  <p>这是一段文字</p>&#10;  <button onclick=&quot;alert('clicked')&quot;>点击我</button>&#10;</div>" spellcheck="false"></textarea>
      </div>
      <div class="ee-code-pane ee-code-pane--preview">
        <div class="ee-code-pane__header">
          <span class="ee-code-pane__title">实时预览</span>
          <span class="ee-code-pane__hint" id="ee-preview-hint">点击预览中的元素可选中编辑</span>
        </div>
        <div class="ee-code-preview-wrapper">
          <iframe class="ee-code-preview" id="ee-code-preview" sandbox="allow-scripts" title="代码预览"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- 元素概览 -->
  <div class="ee-overview" id="ee-overview" style="display:none">
    <div class="ee-tag-row">
      <span class="ee-tag-name" id="ee-tag-name">—</span>
      <span class="ee-tag-info" id="ee-tag-info"></span>
      <span class="ee-tag-dim" id="ee-tag-dim"></span>
      <span class="ee-tag-selector" id="ee-tag-selector" title="CSS选择器"></span>
    </div>
    <div class="ee-breadcrumb" id="ee-breadcrumb"></div>
  </div>

  <!-- 标签页导航 -->
  <div class="ee-tabs" id="ee-tabs" style="display:none">
    <button class="ee-tab ee-tab--active" data-tab="styles">📐 样式</button>
    <button class="ee-tab" data-tab="attrs">🏷 属性</button>
    <button class="ee-tab" data-tab="content">📝 内容</button>
    <button class="ee-tab" data-tab="classes">🎨 类名</button>
    <button class="ee-tab" data-tab="box">📦 盒模型</button>
    <button class="ee-tab" data-tab="children">👶 子元素</button>
    <button class="ee-tab" data-tab="domtree">🌳 DOM树</button>
  </div>

  <!-- 主内容区（可滚动） -->
  <div class="ee-main" id="ee-main">

    <!-- 样式标签页 -->
    <div class="ee-panel ee-panel--active" id="panel-styles">
      <div class="ee-style-search">
        <input type="text" id="ee-style-filter" placeholder="🔍 筛选样式属性...">
      </div>
      <div class="ee-styles" id="ee-styles">
        <div class="ee-empty">请选择一个元素</div>
      </div>
    </div>

    <!-- 属性标签页 -->
    <div class="ee-panel" id="panel-attrs">
      <div class="ee-attrs" id="ee-attrs">
        <div class="ee-empty">请选择一个元素</div>
      </div>
      <div class="ee-add-row">
        <input type="text" id="ee-attr-name" placeholder="属性名">
        <input type="text" id="ee-attr-value" placeholder="属性值">
        <button class="ee-btn ee-btn--primary ee-btn--sm" id="btn-add-attr">+ 添加</button>
      </div>
    </div>

    <!-- 内容标签页（HTML源码 + 文本编辑） -->
    <div class="ee-panel" id="panel-content">
      <div class="ee-section">
        <div class="ee-section-title">HTML 源码</div>
        <textarea id="ee-html-source" class="ee-html-source" placeholder="选择元素后显示HTML源码" readonly></textarea>
        <div class="ee-btn-row">
          <button class="ee-btn ee-btn--secondary ee-btn--sm" id="btn-edit-html">✏️ 编辑HTML</button>
          <button class="ee-btn ee-btn--secondary ee-btn--sm" id="btn-copy-html">📋 复制HTML</button>
        </div>
      </div>
      <div class="ee-section">
        <div class="ee-section-title">文本内容（可编辑）</div>
        <textarea id="ee-text-content" class="ee-text-content" placeholder="选择元素后显示文本内容"></textarea>
        <div class="ee-btn-row">
          <button class="ee-btn ee-btn--primary ee-btn--sm" id="btn-save-text">💾 保存文本</button>
          <button class="ee-btn ee-btn--secondary ee-btn--sm" id="btn-copy-text">📋 复制文本</button>
        </div>
      </div>
    </div>

    <!-- 类名标签页 -->
    <div class="ee-panel" id="panel-classes">
      <div class="ee-classes" id="ee-classes">
        <div class="ee-empty">请选择一个元素</div>
      </div>
      <div class="ee-add-row">
        <input type="text" id="ee-class-name" placeholder="CSS类名">
        <button class="ee-btn ee-btn--primary ee-btn--sm" id="btn-add-class">+ 添加</button>
      </div>
    </div>

    <!-- 盒模型标签页 -->
    <div class="ee-panel" id="panel-box">
      <div class="ee-box-model" id="ee-box-model">
        <div class="ee-empty">请选择一个元素</div>
      </div>
    </div>

    <!-- 子元素标签页 -->
    <div class="ee-panel" id="panel-children">
      <div class="ee-children" id="ee-children">
        <div class="ee-empty">请选择一个元素</div>
      </div>
    </div>

    <!-- DOM树标签页 -->
    <div class="ee-panel" id="panel-domtree">
      <div class="ee-dom-tree" id="ee-dom-tree">
        <div class="ee-empty">请选择一个元素</div>
      </div>
    </div>

  </div>


  <div class="tool-disclaimer">⚠️ 注意：此工具仅用于学习研究，请勿用于非法用途或未授权修改他人页面。</div>
</div>

<!-- Toast -->
<div class="ee-toast" id="ee-toast">
</div>
  <script src="../../common/tool-i18n-dict.js"></script>
  <script src="../../common/tool-i18n.js"></script>
<script src="../../common/tool-runtime.js"></script>
<script src="tool.js"></script>
</body>
</html>
