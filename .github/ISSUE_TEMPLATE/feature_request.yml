name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景与痛点，而不是直接给出实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 需要新增一个工具
        - label: 需要新增/修改外部服务端点
        - label: 涉及注入类功能（需要修改页面行为）
        - label: 仅文档
